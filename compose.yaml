services:
  mongo:
    image: mongo:8
    command: ["mongod","--replSet","rs0","--bind_ip_all"]
    ports: ["27017:27017"]
    healthcheck: { test: ["CMD","mongosh","--quiet","--eval","db.adminCommand('ping').ok"], interval: 5s, timeout: 3s, retries: 20 }
  mongo-init:
    image: mongo:8
    depends_on: { mongo: { condition: service_healthy } }
    restart: "no"
    entrypoint: ["mongosh","--host","mongo:27017","--eval","try { rs.status() } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) }"]
  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD","redis-cli","ping"], interval: 5s, timeout: 3s, retries: 10 }
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
    ports: ["9000:9000","9001:9001"]
    healthcheck: { test: ["CMD","curl","-f","http://localhost:9000/minio/health/live"], interval: 5s, timeout: 3s, retries: 20 }
  minio-init:
    image: minio/minio:latest
    depends_on: { minio: { condition: service_healthy } }
    restart: "no"
    entrypoint: ["/bin/sh","-c"]
    command: ["mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin} && mc mb --ignore-existing local/${S3_BUCKET:-task-attachments}"]
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025","8025:8025"]
  api:
    build: .
    image: task-tracking-api:local
    env_file: .env
    environment: { RUN_BACKGROUND_WORKERS: "false" }
    ports: ["3000:3000"]
    depends_on:
      mongo-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      mailpit: { condition: service_healthy }
    healthcheck: { test: ["CMD","node","-e","fetch('http://localhost:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"], interval: 5s, timeout: 3s, retries: 20, start_period: 5s }
  worker:
    build: .
    image: task-tracking-api:local
    command: ["node","dist/worker.js"]
    env_file: .env
    environment: { RUN_BACKGROUND_WORKERS: "true" }
    depends_on:
      mongo-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      mailpit: { condition: service_healthy }
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    profiles: ["observability"]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes: ["./ops/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro"]
    ports: ["4318:4318"]
  loki:
    image: grafana/loki:latest
    profiles: ["observability"]
    ports: ["3100:3100"]
  tempo:
    image: grafana/tempo:latest
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo.yaml"]
    volumes: ["./ops/tempo.yaml:/etc/tempo.yaml:ro"]
    ports: ["3200:3200"]
  prometheus:
    image: prom/prometheus:latest
    profiles: ["observability"]
    volumes: ["./ops/prometheus.yaml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:latest
    profiles: ["observability"]
    ports: ["3001:3000"]
