services:
  mongo:
    image: mongo:8
    command: ["mongod","--replSet","rs0","--bind_ip_all"]
    ports: ["27017:27017"]
    healthcheck: { test: ["CMD","mongosh","--quiet","--eval","db.adminCommand('ping').ok"], interval: 5s, timeout: 3s, retries: 20 }
  mongo-init:
    image: mongo:8
    depends_on: { mongo: { condition: service_healthy } }
    restart: "no"
    entrypoint: ["mongosh","--host","mongo:27017","--eval","try { rs.status() } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) }"]
  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD","redis-cli","ping"], interval: 5s, timeout: 3s, retries: 10 }
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
    ports: ["9000:9000","9001:9001"]
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025","8025:8025"]
  api:
    build: .
    env_file: .env
    ports: ["3000:3000"]
    depends_on:
      mongo-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio: { condition: service_started }
      mailpit: { condition: service_started }
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    profiles: ["observability"]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes: ["./ops/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro"]
    ports: ["4318:4318"]
  loki:
    image: grafana/loki:latest
    profiles: ["observability"]
    ports: ["3100:3100"]
  tempo:
    image: grafana/tempo:latest
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo.yaml"]
    volumes: ["./ops/tempo.yaml:/etc/tempo.yaml:ro"]
    ports: ["3200:3200"]
  prometheus:
    image: prom/prometheus:latest
    profiles: ["observability"]
    volumes: ["./ops/prometheus.yaml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:latest
    profiles: ["observability"]
    ports: ["3001:3000"]
