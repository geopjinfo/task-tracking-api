name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: cp .env.example .env
      - name: Create CI network
        run: docker network create task-tracking-ci
      - name: Start MongoDB
        run: docker run -d --name task-ci-mongo --network task-tracking-ci -p 27017:27017 mongo:8 mongod --replSet rs0 --bind_ip_all
      - name: Start Redis
        run: docker run -d --name task-ci-redis --network task-tracking-ci -p 6379:6379 redis:8-alpine
      - name: Start MinIO
        run: |
          if ! output=$(docker run -d --name task-ci-minio --network task-tracking-ci -p 9000:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin ghcr.io/coollabsio/minio@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9 server /data 2>&1); then
            echo "::error title=MinIO startup failed::$output"
            exit 1
          fi
      - name: Start Mailpit
        run: docker run -d --name task-ci-mailpit --network task-tracking-ci -p 1025:1025 -p 8025:8025 axllent/mailpit:latest
      - name: Initialize MongoDB replica set
        run: |
          for attempt in {1..30}; do docker exec task-ci-mongo mongosh --quiet --eval "db.adminCommand('ping').ok" && break; sleep 2; done
          docker exec task-ci-mongo mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]})"
          for attempt in {1..30}; do docker exec task-ci-mongo mongosh --quiet --eval "if (!db.hello().isWritablePrimary) quit(1)" && break; sleep 2; done
      - name: Initialize MinIO bucket
        run: |
          docker exec task-ci-minio sh -c 'mc alias set local http://localhost:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null'
          for attempt in {1..30}; do
            if timeout 5s docker exec task-ci-minio mc mb --ignore-existing local/task-attachments; then
              exit 0
            fi
            sleep 2
          done
          status=$(docker inspect --format '{{json .State}}' task-ci-minio | tr '\n' ' ')
          logs=$(docker logs task-ci-minio 2>&1 | tr '\n' ' ')
          echo "::error title=MinIO bucket initialization failed::$status $logs"
          exit 1
      - name: Wait for Mailpit
        run: |
          for attempt in {1..30}; do curl --fail --silent http://localhost:8025/api/v1/info && break; sleep 2; done
      - run: npm run build
      - name: Apply and verify database migrations
        env:
          MONGODB_URI: mongodb://localhost:27017/task_tracking?replicaSet=rs0&directConnection=true
        run: |
          npm run migrate
          npm run migrate:status | grep -q "001 applied initial-schema"
      - run: npm run check
      - run: npm run test:coverage
      - run: npm audit --omit=dev --audit-level=critical
      - uses: gitleaks/gitleaks-action@v2
      - run: docker compose config --quiet
      - name: Validate production Caddy topology
        env:
          DOMAIN: api.example.test
          JWT_SECRET: ci-production-compose-secret-32-characters
        run: docker compose -f compose.yaml -f compose.prod.yaml config --quiet
      - name: Stop integration dependencies
        if: always()
        run: |
          docker rm --force task-ci-mongo task-ci-redis task-ci-minio task-ci-mailpit || true
          docker network rm task-tracking-ci || true
