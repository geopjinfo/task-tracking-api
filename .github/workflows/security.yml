name: Security
on:
  schedule: [{ cron: '0 5 * * 1' }]
  workflow_dispatch:
jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=critical
      - uses: gitleaks/gitleaks-action@v2
