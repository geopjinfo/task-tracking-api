openapi: 3.1.0
info: { title: Task Tracking API, version: 1.0.0 }
servers: [{ url: http://localhost:3000/api/v1 }]
components:
  securitySchemes: { bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT } }
  schemas:
    Error: { type: object, required: [error], properties: { error: { type: object, required: [code, message], properties: { code: { type: string }, message: { type: string }, requestId: { type: string } } } } }
    Task: { type: object, required: [id, projectId, title, status, version], properties: { id: { type: string, format: uuid }, projectId: { type: string, format: uuid }, title: { type: string }, description: { type: string }, status: { enum: [todo, in_progress, done] }, assigneeId: { type: string, format: uuid }, version: { type: integer } } }
paths:
  /auth/register:
    post:
      summary: Register
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email, displayName, password], properties: { email: { type: string, format: email }, displayName: { type: string }, password: { type: string, minLength: 10 } } } } } }
      responses: { '201': { description: Registered }, '409': { description: Email exists } }
  /auth/login: { post: { summary: Login, responses: { '200': { description: Authenticated }, '401': { description: Invalid credentials } } } }
  /auth/refresh: { post: { summary: Rotate refresh token, responses: { '200': { description: Rotated }, '401': { description: Invalid or replayed token } } } }
  /auth/logout: { post: { summary: Revoke session, responses: { '204': { description: Logged out } } } }
  /users/me: { get: { security: [{ bearerAuth: [] }], responses: { '200': { description: Profile } } }, patch: { security: [{ bearerAuth: [] }], responses: { '200': { description: Updated } } } }
  /projects: { get: { security: [{ bearerAuth: [] }], responses: { '200': { description: Projects } } }, post: { security: [{ bearerAuth: [] }], responses: { '201': { description: Created } } } }
  /projects/{projectId}/tasks:
    parameters: [{ in: path, name: projectId, required: true, schema: { type: string, format: uuid } }]
    get: { security: [{ bearerAuth: [] }], responses: { '200': { description: Tasks } } }
    post: { security: [{ bearerAuth: [] }], responses: { '201': { description: Created } } }
  /tasks/{taskId}:
    parameters: [{ in: path, name: taskId, required: true, schema: { type: string, format: uuid } }]
    get: { security: [{ bearerAuth: [] }], responses: { '200': { description: Task, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } } } }
    patch: { security: [{ bearerAuth: [] }], responses: { '200': { description: Updated }, '409': { description: Version conflict } } }
    delete: { security: [{ bearerAuth: [] }], responses: { '204': { description: Deleted } } }
  /notifications/stream: { get: { security: [{ bearerAuth: [] }], responses: { '200': { description: Server-sent event stream, content: { text/event-stream: { schema: { type: string } } } } } } }
  /ai/tasks/description-draft: { post: { security: [{ bearerAuth: [] }], responses: { '200': { description: Unpersisted draft }, '503': { description: Provider not configured } } } }
